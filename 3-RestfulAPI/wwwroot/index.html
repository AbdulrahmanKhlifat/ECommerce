<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartStore</title>
  <meta name="description" content="Shop the SmartStore catalog, manage your cart and orders, and ask the AI assistant for help." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232B4ACB'/><path d='M9 12h14l-1.5 11h-11z' fill='%23FFD23F'/><path d='M12 12a4 4 0 0 1 8 0' stroke='%23FFD23F' stroke-width='2' fill='none'/></svg>" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="logo" aria-label="SmartStore home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M9 12h14l-1.5 11h-11z" fill="var(--tag)"/><path d="M12 12a4 4 0 0 1 8 0" stroke="var(--tag)" stroke-width="2" fill="none"/></svg>
        <span>SmartStore</span>
      </a>
      <form class="search" id="searchForm" role="search">
        <label class="sr" for="searchInput">Search products</label>
        <input id="searchInput" type="search" placeholder="Search products" autocomplete="off" />
        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        </button>
      </form>
      <nav class="actions" aria-label="Account">
        <button class="icon-btn" id="chatBtn" type="button" aria-label="Ask the assistant">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
          <span class="lbl">Assistant</span>
        </button>
        <a class="icon-btn" href="#/wishlist" aria-label="Wishlist">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
          <span class="lbl">Saved</span>
        </a>
        <a class="icon-btn" id="accountLink" href="#/login" aria-label="Account">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span class="lbl" id="accountLabel">Sign in</span>
        </a>
        <button class="icon-btn cart-btn" id="cartBtn" type="button" aria-label="Open cart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
          <span class="badge" id="cartCount" hidden>0</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="footer">
    <p>SmartStore. Prices include VAT. Orders ship within 3 to 5 days.</p>
  </footer>

  <!-- Cart drawer: the receipt -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="cartDrawer" aria-label="Cart" aria-hidden="true" inert>
    <div class="receipt">
      <div class="receipt-head">
        <strong>SmartStore</strong>
        <span id="receiptDate"></span>
        <button class="close" type="button" data-close aria-label="Close cart">×</button>
      </div>
      <div id="cartBody"></div>
    </div>
  </aside>

  <!-- Assistant panel -->
  <aside class="drawer chat" id="chatDrawer" aria-label="Shopping assistant" aria-hidden="true" inert>
    <div class="chat-head">
      <div>
        <strong>Shopping assistant</strong>
        <p>Answers come from the live catalog.</p>
      </div>
      <button class="close" type="button" data-close aria-label="Close assistant">×</button>
    </div>
    <div class="chat-log" id="chatLog" aria-live="polite">
      <div class="msg bot">Tell me what you're shopping for and your budget. I'll pick matching products from the store.</div>
    </div>
    <div class="chat-suggest" id="chatSuggest">
      <button type="button">A laptop under $800</button>
      <button type="button">Gift ideas for a runner</button>
      <button type="button">What's good for a home office?</button>
    </div>
    <form class="chat-form" id="chatForm">
      <label class="sr" for="chatInput">Message</label>
      <input id="chatInput" placeholder="Ask about any product" autocomplete="off" required />
      <button class="btn primary" type="submit">Send</button>
    </form>
  </aside>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
